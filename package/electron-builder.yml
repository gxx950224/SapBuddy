appId: com.abapbuddy.desktop
productName: AbapBuddy
directories:
  output: release
files:
  - main.js
  - preload.js
  - package.json
extraResources:
  # ===== 完整项目源码（供二次开发） =====
  # webide 后端 + 前端
  - from: ../webide
    to: webide
  # ABAP CLI 工具源码
  - from: ../gxx-abap
    to: gxx-abap
  # Agent 配置 / 扩展 / 技能 / 提示词
  - from: ../.pi
    to: .pi
  # 打包时不携带 output，由 main.js 启动时自动创建
  # 项目级 node_modules（PI SDK 等依赖）
  # 过滤掉 .ts/.map/测试/文档 等开发环境文件，缩小安装包体积
  - from: ../node_modules
    to: node_modules
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.map"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/docs/**"
      - "!**/examples/**"
      - "!**/CHANGELOG*"
  # 项目文档与铁律
  - from: ../AGENTS.md
    to: AGENTS.md
  - from: ../SYSTEM.md
    to: SYSTEM.md
  - from: ../Memory.md
    to: Memory.md
  - from: ../README.md
    to: README.md
  # 启动脚本
  - from: ../AbapBuddy.bat
    to: AbapBuddy.bat
  - from: ../AbapBuddy-desktop.bat
    to: AbapBuddy-desktop.bat
  - from: ../gxx-abap.bat
    to: gxx-abap.bat
  # 内置 Node 运行时：仅保留 node.exe（npm/npx/corepack 运行时用不到，剥离可少 2000+ 文件、约 18MB）
  - from: ../node
    to: node
    filter:
      - node.exe
asar: true
afterPack: "./afterPack.js"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: "AbapBuddy-setup.${ext}"
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AbapBuddy
  installerIcon: null
  uninstallerIcon: null
  include: install.nsh
